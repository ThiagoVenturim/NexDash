apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexdash
  labels:
    app.kubernetes.io/name: nexdash
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nexdash
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexdash
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: nexdash
          image: nexdash:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: nexdash-config
            - secretRef:
                name: nexdash-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          emptyDir: {}
