apiVersion: v1
kind: Secret
metadata:
  name: nexdash-secrets
  labels:
    app.kubernetes.io/name: nexdash
type: Opaque
stringData:
  # Database connection string placeholder (override with cluster secret or external manager)
  DB_URL: "sqlite:////app/data/nexdash.db"
  # API token for REST, /mcp and the web UI. Never commit a real value; set it with
  # kubectl create secret generic nexdash-secrets --from-literal=NEXDASH_API_TOKEN=<value>
  # or an external secret manager.
