[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "askdash"
version = "0.1.0"
description = "Dashboards and reports from natural-language questions through a semantic layer, exposed over MCP and REST."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42.0",
  "faccoder-core",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/askdash"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
# S105/S106: names of environment variables that hold secrets are not secrets.
ignore = ["S101", "S105", "S106"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "B"]
"scripts/**" = ["S603", "S607"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
